<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>OpenClaw chat</title>
  <style>
    :root { color-scheme: light dark; }
    body { font: 13px system-ui, sans-serif; margin: 0; width: 380px; display: flex; flex-direction: column; height: 520px; }
    body.tab { width: auto; max-width: 48rem; margin: 0 auto; height: 100vh; }
    header { display: flex; gap: .5rem; align-items: center; padding: .5rem; border-bottom: 1px solid #8884; }
    header strong { flex: 1; }
    #log { flex: 1; overflow-y: auto; padding: .5rem; }
    .msg { margin: .4rem 0; padding: .4rem .6rem; border-radius: 6px; white-space: pre-wrap; word-break: break-word; }
    .user { background: #4a90e233; margin-left: 2rem; }
    .assistant { background: #8882; margin-right: 2rem; }
    .error { background: #e2504a33; }
    .context { background: #8881; margin-right: 2rem; border-left: 3px solid #8888; font-style: italic; }
    form { display: flex; gap: .5rem; padding: .5rem; border-top: 1px solid #8884; }
    textarea { flex: 1; resize: none; font: inherit; }
  </style>
</head>
<body>
  <header>
    <strong>OpenClaw</strong>
    <button id="new" type="button">New session</button>
    <button id="pop" type="button" title="Open in a tab">↗</button>
  </header>
  <div id="log" aria-live="polite"></div>
  <form id="form">
    <textarea id="text" rows="3" placeholder="Message… (Enter to send, Shift+Enter for a new line)" aria-label="Message"></textarea>
    <button type="submit">Send</button>
  </form>
  <script src="chat.js"></script>
</body>
</html>
